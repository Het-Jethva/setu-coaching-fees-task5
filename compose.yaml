services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu_local_demo
      POSTGRES_DB: setu
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu -d setu"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - setu-db:/var/lib/postgresql/data
volumes:
  setu-db:
